/* ============================================================

   ============================================================ */
function ProductCard({ product, wishlist, toggleWishlist, addToCart, navigate, mini }) {
  const inWish = wishlist.includes(product.id);
  const [hovered, setHovered] = useState(false);
  const [selectedSize, setSelectedSize] = useState('');

  const isSalwar = product.category === 'Salwars';

  const handleAddToCart = () => {
    if (isSalwar && !selectedSize) {
      alert('Please select a size before adding to cart.');
      return;
    }
    addToCart(product, selectedSize || null);
  };

  return (
    <div className="product-card bg-white rounded-lg overflow-hidden border border-beige/60 cursor-pointer relative group"
      onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}>

      {/* Badges */}
      <div className="absolute top-2.5 left-2.5 z-10 flex flex-col gap-1.5">
        {product.isNew && <span className="badge-new">NEW</span>}
        {product.isBestSeller && <span className="badge-best">BEST SELLER</span>}
        {product.stock <= 8 && <span className="badge-limited">LIMITED</span>}
        {product.discount >= 25 && <span className="badge-sale">{product.discount}% OFF</span>}
      </div>

      {/* Wishlist icon */}
      <button onClick={(e) => { e.stopPropagation(); toggleWishlist(product.id); }}
        className={`wishlist-btn absolute top-2.5 right-2.5 z-10 w-8 h-8 bg-white/90 rounded-full flex items-center justify-center shadow transition-opacity ${hovered || inWish ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}
        aria-label="Wishlist">
        <Icon.Heart className={`w-4 h-4 ${inWish ? 'wishlist-active' : 'text-warm-gray'}`} filled={inWish} />
      </button>

      {/* Image */}
      <a href={`#/product/${product.id}`} className="card-img block aspect-product bg-ivory overflow-hidden">
        <img src={product.images[0]} alt={product.name} loading="lazy" onError={handleImgError}
          className="w-full h-full object-cover object-top transition-transform duration-500"
          style={{transform: hovered ? 'scale(1.06)' : 'scale(1)'}} />
      </a>

      {/* Info */}
      <div className="p-3">
        <a href={`#/product/${product.id}`}>
          <h3 className="font-serif font-medium text-dark-brown text-sm leading-snug mb-1 hover:text-maroon transition-colors line-clamp-2">{product.name}</h3>
        </a>
        <Stars rating={product.rating} small />

        {/* Sizes (salwar) */}
        {isSalwar && (
          <div className="mt-2 mb-1">
            <div className="text-xs text-warm-gray font-sans mb-1">Size:</div>
            <div className="flex gap-1 flex-wrap">
              {product.sizes.map(sz => (
                <button key={sz} onClick={() => setSelectedSize(sz === selectedSize ? '' : sz)}
                  className={`size-btn text-xs px-2 py-0.5 ${selectedSize === sz ? 'selected' : ''}`}>{sz}</button>
              ))}
            </div>
          </div>
        )}

        {/* Price */}
        <div className="flex items-baseline gap-2 mt-2">
          <span className="font-sans font-bold text-maroon text-base">{fmt(product.price)}</span>
          <span className="font-sans text-warm-gray text-xs line-through">{fmt(product.originalPrice)}</span>
        </div>

        {/* Buttons */}
        <div className="mt-3 flex gap-2">
          <button onClick={handleAddToCart}
            className="flex-1 btn-gold py-2 rounded text-xs font-sans tracking-wide">
            Add to Cart
          </button>
          <a href={`#/product/${product.id}`}
            className="btn-outline py-2 px-3 rounded text-xs font-sans">
            View
          </a>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   FILTER PANEL
   ============================================================ */
function FilterPanel({ filters, setFilters, products, category, onClose }) {
  const fabrics = [...new Set(products.map(p => p.fabric))];
  const colors = [...new Set(products.map(p => p.color))];
  const occasions = [...new Set(products.map(p => p.occasion))];
  const allSizes = ['S','M','L','XL','XXL'];

  const toggle = (key, val) => {
    setFilters(f => {
      const arr = f[key] || [];
      return { ...f, [key]: arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val] };
    });
  };

  const FilterGroup = ({ title, options, filterKey }) => {
    const [open, setOpen] = useState(true);
    return (
      <div className="border-b border-beige pb-3 mb-3">
        <button onClick={() => setOpen(!open)} className="flex items-center justify-between w-full text-left mb-2">
          <span className="font-sans font-semibold text-dark-brown text-sm">{title}</span>
          <Icon.Chevron className="w-4 h-4 text-warm-gray" down={!open} />
        </button>
        {open && (
          <div className="space-y-1.5">
            {options.map(opt => (
              <label key={opt} className="flex items-center gap-2 cursor-pointer group">
                <input type="checkbox" checked={(filters[filterKey]||[]).includes(opt)} onChange={() => toggle(filterKey, opt)} className="rounded"/>
                <span className="font-sans text-sm text-dark-brown group-hover:text-maroon">{opt}</span>
              </label>
            ))}
          </div>
        )}
      </div>
    );
  };

  return (
    <div className="bg-white border border-beige rounded-lg p-4 sticky top-24 max-h-screen overflow-y-auto">
      <div className="flex items-center justify-between mb-4">
        <h3 className="font-serif font-semibold text-dark-brown text-base">Filters</h3>
        <div className="flex gap-2 items-center">
          <button onClick={() => setFilters({})} className="text-xs text-maroon font-sans hover:underline">Clear All</button>
          {onClose && <button onClick={onClose} className="sm:hidden text-warm-gray"><Icon.X className="w-4 h-4" /></button>}
        </div>
      </div>

      {/* Price range */}
      <div className="border-b border-beige pb-3 mb-3">
        <p className="font-sans font-semibold text-dark-brown text-sm mb-2">Price Range</p>
        <div className="flex items-center gap-2 text-xs text-warm-gray font-sans mb-2">
          <span>{fmt(filters.minPrice || 0)}</span> — <span>{fmt(filters.maxPrice || 5000)}</span>
        </div>
        <input type="range" min="0" max="5000" step="100" value={filters.maxPrice || 5000}
          onChange={e => setFilters(f => ({...f, maxPrice: Number(e.target.value)}))}
          className="w-full"/>
      </div>

      {category === 'Salwars' && <FilterGroup title="Size" options={allSizes} filterKey="sizes" />}
      <FilterGroup title="Fabric" options={fabrics} filterKey="fabrics" />
      <FilterGroup title="Color" options={colors} filterKey="colors" />
      <FilterGroup title="Occasion" options={occasions} filterKey="occasions" />

      {/* Discount filter */}
      <div className="border-b border-beige pb-3 mb-3">
        <p className="font-sans font-semibold text-dark-brown text-sm mb-2">Discount</p>
        {[10,20,25,30].map(d => (
          <label key={d} className="flex items-center gap-2 cursor-pointer mb-1.5">
            <input type="checkbox" checked={(filters.discounts||[]).includes(d)} onChange={() => toggle('discounts', d)}/>
            <span className="font-sans text-sm text-dark-brown">{d}% & above</span>
          </label>
        ))}
      </div>
    </div>
  );
}

function ProductListingPage({ category, products, wishlist, toggleWishlist, addToCart, navigate }) {
  const [filters, setFilters] = useState({});
  const [sort, setSort] = useState('recommended');
  const [filterOpen, setFilterOpen] = useState(false);

  const filtered = useMemo(() => {
    let arr = products.filter(p => p.category === category);
    if (filters.maxPrice) arr = arr.filter(p => p.price <= filters.maxPrice);
    if (filters.fabrics?.length) arr = arr.filter(p => filters.fabrics.includes(p.fabric));
    if (filters.colors?.length) arr = arr.filter(p => filters.colors.includes(p.color));
    if (filters.occasions?.length) arr = arr.filter(p => filters.occasions.some(o => p.occasion.includes(o)));
    if (filters.sizes?.length && category === 'Salwars') arr = arr.filter(p => filters.sizes.some(s => p.sizes.includes(s)));
    if (filters.discounts?.length) arr = arr.filter(p => filters.discounts.some(d => p.discount >= d));

    if (sort === 'price-asc') arr = [...arr].sort((a,b) => a.price - b.price);
    else if (sort === 'price-desc') arr = [...arr].sort((a,b) => b.price - a.price);
    else if (sort === 'discount') arr = [...arr].sort((a,b) => b.discount - a.discount);
    else if (sort === 'rating') arr = [...arr].sort((a,b) => b.rating - a.rating);
    else if (sort === 'newest') arr = arr.filter(p => p.isNew).concat(arr.filter(p => !p.isNew));
    return arr;
  }, [products, category, filters, sort]);

  return (
    <div className="page-enter max-w-7xl mx-auto px-4 sm:px-6 py-8">
      {/* Page header */}
      <div className="text-center mb-8">
        <h1 className="font-serif text-3xl sm:text-4xl text-maroon font-semibold mb-2">
          {category === 'Sarees' ? 'Our Saree Collection' : 'Our Salwar Suit Collection'}
        </h1>
        <div className="gold-divider" />
        <p className="font-sans text-warm-gray text-sm">
          {category === 'Sarees'
            ? 'Discover timeless elegance — from traditional silks to modern chiffons.'
            : 'Comfortable, stylish salwar sets for every woman, every occasion.'}
        </p>
      </div>

      <div className="flex gap-6">
        {/* Filter — desktop sidebar */}
        <div className="hidden sm:block w-56 shrink-0">
          <FilterPanel filters={filters} setFilters={setFilters} products={products} category={category} />
        </div>

        {/* Main content */}
        <div className="flex-1 min-w-0">
          {/* Toolbar */}
          <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
            <div className="flex items-center gap-3">
              <button className="sm:hidden flex items-center gap-1.5 border border-beige rounded px-3 py-2 text-sm font-sans text-dark-brown bg-white"
                onClick={() => setFilterOpen(true)}>
                <Icon.Filter className="w-4 h-4" /> Filters
              </button>
              <span className="text-sm font-sans text-warm-gray">{filtered.length} products</span>
            </div>
            <SortDropdown sort={sort} setSort={setSort} />
          </div>

          <ProductGrid products={filtered} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} navigate={navigate} />
        </div>
      </div>

      {/* Mobile filter drawer */}
      {filterOpen && (
        <div className="fixed inset-0 z-50 flex sm:hidden" onClick={() => setFilterOpen(false)}>
          <div className="overlay absolute inset-0" />
          <div className="relative bg-cream w-72 max-h-screen overflow-y-auto p-4 z-10 ml-auto" onClick={e => e.stopPropagation()}>
            <FilterPanel filters={filters} setFilters={setFilters} products={products} category={category} onClose={() => setFilterOpen(false)} />
          </div>
        </div>
      )}
    </div>
  );
}

          <p className="font-sans text-sm text-warm-gray leading-relaxed mb-5">{product.description}</p>

          {/* Size selector (salwar) */}

                    ['Color', product.color],
                    ['Pattern', product.pattern],

                    ...(product.blouse ? [['Blouse', product.blouse]] : []),

/* ============================================================
   CART PAGE
   ============================================================ */
function CartPage({ cart, updateQty, removeFromCart, navigate }) {
  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const origTotal = cart.reduce((s, i) => s + i.originalPrice * i.qty, 0);
  const discount = origTotal - subtotal;
  const delivery = subtotal >= 999 ? 0 : 79;
  const total = subtotal + delivery;

  if (!cart.length) return (
    <div className="page-enter max-w-2xl mx-auto px-4 py-20 text-center">
      <div className="text-6xl mb-4">🛍️</div>
      <h2 className="font-serif text-2xl text-dark-brown mb-2">Your Cart is Empty</h2>
      <p className="font-sans text-warm-gray mb-6">Add some beautiful sarees or salwar sets to get started.</p>
      <a href="#/sarees" className="btn-maroon inline-block px-8 py-3 rounded font-sans">Shop Sarees</a>
    </div>
  );

  return (
    <div className="page-enter max-w-6xl mx-auto px-4 sm:px-6 py-8">
      <h1 className="font-serif text-2xl text-maroon font-semibold mb-6">Shopping Cart ({cart.reduce((s,i)=>s+i.qty,0)} items)</h1>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
        {/* Cart items */}
        <div className="lg:col-span-2 space-y-4">
          {cart.map(item => (
            <div key={`${item.id}-${item.size}`} className="bg-white rounded-xl border border-beige p-4 flex gap-4">
              <a href={`#/product/${item.id}`} className="w-20 h-25 shrink-0 rounded overflow-hidden bg-ivory aspect-[4/5]">
                <img src={item.images[0]} alt={item.name} onError={handleImgError} className="w-full h-full object-cover object-top" />
              </a>
              <div className="flex-1 min-w-0">
                <a href={`#/product/${item.id}`}>
                  <h3 className="font-serif font-medium text-dark-brown leading-snug hover:text-maroon text-sm sm:text-base">{item.name}</h3>
                </a>
                {item.size && <p className="text-xs text-warm-gray font-sans mt-0.5">Size: <strong>{item.size}</strong></p>}
                <p className="text-xs text-warm-gray font-sans">Category: {item.category}</p>
                <div className="flex items-center justify-between mt-3 flex-wrap gap-2">
                  <div className="flex items-center gap-2">
                    <button className="qty-btn" onClick={() => updateQty(item.id, item.size, item.qty-1)}>−</button>
                    <span className="font-sans font-bold text-dark-brown w-6 text-center text-sm">{item.qty}</span>
                    <button className="qty-btn" onClick={() => updateQty(item.id, item.size, item.qty+1)}>+</button>
                  </div>
                  <div className="text-right">
                    <div className="font-bold text-maroon font-sans">{fmt(item.price * item.qty)}</div>
                    <div className="text-xs text-warm-gray line-through font-sans">{fmt(item.originalPrice * item.qty)}</div>
                  </div>
                </div>
              </div>
              <button onClick={() => removeFromCart(item.id, item.size)} className="text-warm-gray hover:text-maroon transition-colors shrink-0">
                <Icon.Trash className="w-4 h-4" />
              </button>
            </div>
          ))}
        </div>

        {/* Order summary */}
        <div>
          <div className="bg-white rounded-xl border border-beige p-5 sticky top-24">
            <h2 className="font-serif text-lg text-dark-brown font-semibold mb-4 border-b border-beige pb-3">Order Summary</h2>
            <div className="space-y-2.5 font-sans text-sm mb-4">
              <div className="flex justify-between"><span className="text-warm-gray">Subtotal</span><span className="font-medium">{fmt(subtotal)}</span></div>
              <div className="flex justify-between text-emerald-700"><span>Discount</span><span>− {fmt(discount)}</span></div>
              <div className="flex justify-between"><span className="text-warm-gray">Delivery</span><span className={delivery === 0 ? 'text-emerald-700 font-medium' : 'font-medium'}>{delivery === 0 ? 'FREE' : fmt(delivery)}</span></div>
              {delivery > 0 && <p className="text-xs text-warm-gray">Add {fmt(999 - subtotal)} more for free delivery</p>}
            </div>
            <div className="border-t border-beige pt-3 mb-5 flex justify-between font-bold font-sans text-dark-brown text-base">
              <span>Total</span><span className="text-maroon text-lg">{fmt(total)}</span>
            </div>
            <a href="#/checkout" className="btn-gold w-full block text-center py-3 rounded font-sans tracking-wide">Proceed to Checkout</a>
            <a href="#/sarees" className="block text-center text-sm font-sans text-maroon hover:underline mt-3">Continue Shopping</a>
          </div>
        </div>
      </div>
    </div>
  );
}

function CheckoutPage({ cart }) {
  const [form, setForm] = useState({ name:'', mobile:'', email:'', address:'', city:'', state:'', pin:'', payment:'cod' });
  const [placed, setPlaced] = useState(false);

  const set = (k, v) => setForm(f => ({...f, [k]: v}));

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const delivery = subtotal >= 999 ? 0 : 79;
  const total = subtotal + delivery;

  const submit = (e) => {
    e.preventDefault();
    setPlaced(true);
  };

  if (placed) return (
    <div className="page-enter max-w-lg mx-auto px-4 py-20 text-center">
      <div className="text-6xl mb-4">🎉</div>
      <h2 className="font-serif text-3xl text-maroon font-semibold mb-3">Order Placed!</h2>
      <p className="font-sans text-warm-gray mb-2">Thank you, {form.name}! Your order has been placed successfully.</p>

      <div className="bg-white border border-beige rounded-xl p-5 text-left mb-6 font-sans text-sm">
        <p><strong className="text-dark-brown">Total Paid:</strong> <span className="text-maroon font-bold">{fmt(total)}</span></p>
        <p><strong className="text-dark-brown">Payment:</strong> {form.payment === 'cod' ? 'Cash on Delivery' : form.payment === 'upi' ? 'UPI' : 'Card'}</p>

      </div>
      <a href="#/" className="btn-gold inline-block px-8 py-3 rounded font-sans">Continue Shopping</a>
    </div>
  );

  return (
    <div className="page-enter max-w-5xl mx-auto px-4 sm:px-6 py-8">
      <h1 className="font-serif text-2xl text-maroon font-semibold mb-6">Checkout</h1>

                  <label className="block font-sans text-sm font-medium text-dark-brown mb-1">{label}</label>

            <button type="submit" className="btn-maroon w-full py-3 rounded font-sans tracking-wide block text-center">Place Order</button>

        </div>

/* ============================================================
   FILTERED PAGES (New Arrivals, Best Sellers, Offers)
   ============================================================ */
function FilteredPage({ title, sub, products, filter, wishlist, toggleWishlist, addToCart, navigate }) {
  const filtered = useMemo(() => {
    if (filter === 'new') return products.filter(p => p.isNew);
    if (filter === 'best') return products.filter(p => p.isBestSeller);
    if (filter === 'offers') return products.filter(p => p.discount >= 25);
    return products;
  }, [products, filter]);

  const [sort, setSort] = useState('recommended');
  const sorted = useMemo(() => {
    let arr = [...filtered];
    if (sort === 'price-asc') arr.sort((a,b) => a.price - b.price);
    else if (sort === 'price-desc') arr.sort((a,b) => b.price - a.price);
    else if (sort === 'discount') arr.sort((a,b) => b.discount - a.discount);
    else if (sort === 'rating') arr.sort((a,b) => b.rating - a.rating);
    return arr;
  }, [filtered, sort]);

  return (
    <div className="page-enter max-w-7xl mx-auto px-4 sm:px-6 py-8">
      <div className="text-center mb-8">
        <p className="font-sans text-gold text-xs tracking-widest uppercase mb-1">{sub}</p>
        <h1 className="font-serif text-3xl sm:text-4xl text-maroon font-semibold mb-2">{title}</h1>
        <div className="gold-divider" />
      </div>
      <div className="flex justify-end mb-5">
        <SortDropdown sort={sort} setSort={setSort} />
      </div>
      <ProductGrid products={sorted} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} navigate={navigate} />
    </div>
  );
}

/* ============================================================
   MAIN APP / ROUTER
   ============================================================ */
function App() {
  const [cart, setCart] = useState([]);
  const [wishlist, setWishlist] = useState([]);
  const [toasts, setToasts] = useState([]);
  const [page, setPage] = useState(window.location.hash || '#/');
  const [searchQuery, setSearchQuery] = useState('');

  useEffect(() => {
    const handler = () => setPage(window.location.hash || '#/');
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);

  const showToast = (msg) => {
    const id = Date.now();
    setToasts(t => [...t, { id, msg }]);
  };

  const addToCart = useCallback((product, size) => {
    setCart(cart => {
      const key = `${product.id}-${size}`;
      const existing = cart.find(i => `${i.id}-${i.size}` === key);
      if (existing) {
        showToast(`${product.name} quantity updated`);
        return cart.map(i => `${i.id}-${i.size}` === key ? {...i, qty: i.qty+1} : i);
      }
      showToast(`${product.name} added to cart`);
      return [...cart, {...product, size, qty: 1}];
    });
  }, []);

  const updateQty = useCallback((id, size, qty) => {
    if (qty < 1) { removeFromCart(id, size); return; }
    setCart(cart => cart.map(i => i.id === id && i.size === size ? {...i, qty} : i));
  }, []);

  const removeFromCart = useCallback((id, size) => {
    setCart(cart => cart.filter(i => !(i.id === id && i.size === size)));
    showToast('Item removed from cart');
  }, []);

  const toggleWishlist = useCallback((id) => {
    setWishlist(w => {
      if (w.includes(id)) { showToast('Removed from wishlist'); return w.filter(x => x !== id); }
      showToast('Added to wishlist ♡');
      return [...w, id];
    });
  }, []);

  const navigate = (p, q) => {
    if (p === 'search') { setSearchQuery(q); window.location.hash = '#/search'; }
    else window.location.hash = `#/${p}`;
  };

  // Routing
  const hash = page;

  const renderPage = () => {
    if (hash === '#/' || hash === '') return <HomePage products={ALL_PRODUCTS} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} navigate={navigate} />;
    if (hash === '#/sarees') return <ProductListingPage category="Sarees" products={ALL_PRODUCTS} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} navigate={navigate} />;
    if (hash === '#/salwars') return <ProductListingPage category="Salwars" products={ALL_PRODUCTS} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} navigate={navigate} />;
    if (hash === '#/new-arrivals') return <FilteredPage title="New Arrivals" sub="Just In" products={ALL_PRODUCTS} filter="new" wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} navigate={navigate} />;
    if (hash === '#/best-sellers') return <FilteredPage title="Best Sellers" sub="Fan Favourites" products={ALL_PRODUCTS} filter="best" wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} navigate={navigate} />;
    if (hash === '#/offers') return <FilteredPage title="Festive Offers" sub="Up to 30% OFF" products={ALL_PRODUCTS} filter="offers" wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} navigate={navigate} />;
    if (hash === '#/cart') return <CartPage cart={cart} updateQty={updateQty} removeFromCart={removeFromCart} navigate={navigate} />;
    if (hash === '#/checkout') return <CheckoutPage cart={cart} />;
    if (hash === '#/wishlist') return <WishlistPage wishlist={wishlist} products={ALL_PRODUCTS} toggleWishlist={toggleWishlist} addToCart={addToCart} />;
    if (hash === '#/search') return <SearchPage query={searchQuery} products={ALL_PRODUCTS} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} navigate={navigate} />;
    if (hash === '#/size-guide') return <SizeGuidePage />;

    // Product detail route: #/product/:id
    const match = hash.match(/^#\/product\/(\d+)$/);
    if (match) {
      const prod = ALL_PRODUCTS.find(p => p.id === Number(match[1]));
      if (prod) return <ProductDetailsPage product={prod} wishlist={wishlist} toggleWishlist={toggleWishlist} addToCart={addToCart} />;
    }

    // 404
    return (
      <div className="page-enter text-center py-24 px-4">
        <div className="text-6xl mb-4">🕌</div>
        <h2 className="font-serif text-3xl text-dark-brown font-semibold mb-3">Page Not Found</h2>
        <a href="#/" className="btn-maroon inline-block px-8 py-3 rounded font-sans mt-4">Back to Home</a>
      </div>
    );
  };

  return (
    <div className="min-h-screen flex flex-col bg-cream">
      <Header cart={cart} wishlist={wishlist} navigate={navigate} page={hash} />
      <main className="flex-1">
        {renderPage()}
      </main>
      <Footer />

      {/* Toasts */}
      {toasts.slice(-1).map(t => (
        <Toast key={t.id} message={t.msg} onDone={() => setToasts(ts => ts.filter(x => x.id !== t.id))} />
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
